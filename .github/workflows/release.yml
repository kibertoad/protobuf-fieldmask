---

name: release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}  # every job below requests only what it needs

jobs:
  select-mode:
    runs-on: ubuntu-latest
    name: select mode

    permissions:
      contents: read  # to check out the repository

    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      # No dependency cache in this workflow: caches written by pull request
      # runs must never be restored into a job that can publish (cache poisoning).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          always-auth: false
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1  # v2.1.1

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    name: version

    permissions:
      contents: write  # to push the release branch and delete it after merging
      pull-requests: write  # to open and merge the release pull request

    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          always-auth: false
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1  # v2.1.1
        with:
          script: pnpm run release:version

      # The release pull request only bumps the version and the changelog of code
      # that already passed CI on master, so it is merged without human review.
      - name: Merge release pull request
        id: merge
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail

          if ! gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release pull request #${PR_NUMBER} could not be merged automatically, merge it manually to publish."
            exit 0
          fi

          # The publish job below runs against the merge commit, so it has to be
          # resolved here. It is not always visible on the pull request right away.
          sha=''
          for _ in 1 2 3 4 5; do
            sha="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid // empty')"
            if [ -n "$sha" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/${GH_REPO}/commits/${BASE_BRANCH}" --jq '.sha')"
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  publish:
    needs:
      - select-mode
      - version
    # Merging the release pull request with GITHUB_TOKEN does not start a new
    # workflow run, so the merge commit is published by this run. The 'publish'
    # mode covers master already carrying an unpublished version, which happens
    # when the release pull request was merged by hand or a publish failed.
    if: |
      always() && needs.select-mode.result == 'success' &&
      (needs.select-mode.outputs.mode == 'publish' || needs.version.outputs.merged == 'true')
    runs-on: ubuntu-latest
    name: publish

    permissions:
      contents: write  # to push git tags and create GitHub releases
      id-token: write  # to authenticate against npm through trusted publishing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1
          ref: ${{ needs.version.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          always-auth: false
          node-version: 24.x

      # pnpm publish hands the tarball to the npm CLI, which needs to be recent
      # enough to exchange the OIDC token for a short-lived publish token.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The merge commit created above was not built by any other workflow, since
      # merging with GITHUB_TOKEN does not start new runs.
      - name: Run Tests
        run: pnpm run test

      - name: Publish to npm
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1  # v2.1.1
        with:
          script: pnpm run release:publish
        env:
          # Git tags and GitHub releases are created for GITHUB_SHA, which is the
          # commit that started this run rather than the merge commit it created.
          GITHUB_SHA: ${{ needs.version.outputs.sha || github.sha }}
